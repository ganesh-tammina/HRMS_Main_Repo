<div class="login-wrapper">
  <!-- LEFT SECTION -->
  <div class="login-left">
    <img src="../../assets/login-image-background.svg" alt="Dashboard Illustration" />
  </div>

  <!-- RIGHT SECTION -->
  <div class="login-right">
    <div class="login-card">
      <div class="logo">
        <img src="../../assets/techtammina.webp" alt="Tech Tammina Logo" />
      </div>

      <h2>Log into your account</h2>
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

        <div class="form-group">
          <label>Username</label>
          <input type="text" formControlName="username" placeholder="Enter your username" />
          <small class="error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
            Username is required
          </small>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" placeholder="Enter your password" />
          <small class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            Password is required
          </small>
        </div>

        <div class="forgot">
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
          Login
        </button>

      </form>
    </div>
  </div>
</div>
