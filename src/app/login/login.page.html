<div class="login-wrapper">
  <div class="img">
    <img src="assets/login-image-background.svg" />
  </div>
    <div class="login-right">
    <div class="login-card">

      <h2>Log into your account</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- EMAIL -->
        <div class="form-group">
          <label>Username</label>
          <input
            type="email"
            formControlName="email"
            placeholder="Enter your Username"
            [disabled]="emailChecked"
          />
          <small class="error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
            Username is required
          </small>
        </div>

        <!-- PASSWORD -->
        <div class="form-group" *ngIf="showPassword">
          <label>Password</label>
          <input
            type="password"
            formControlName="password"
            placeholder="Enter password"
          />
        </div>

        <!-- CREATE PASSWORD -->
        <div class="form-group" *ngIf="showCreatePassword">
          <label>Create Password</label>
          <input
            type="password"
            formControlName="password"
            placeholder="Create password"
          />
        </div>

        <!-- NEXT -->
        <button
          type="button"
          class="btn-primary"
          *ngIf="!emailChecked"
          (click)="onNext()"
          [disabled]="loginForm.get('email')?.invalid"
        >
          Next
        </button>

        <!-- LOGIN -->
        <button
          type="submit"
          class="btn-primary"
          *ngIf="showPassword"
        >
          Login
        </button>

        <!-- CREATE ACCOUNT -->
        <button
          type="submit"
          class="btn-primary"
          *ngIf="showCreatePassword"
        >
          Create Password & Login
        </button>

      </form>

    </div>
  </div>
</div>
