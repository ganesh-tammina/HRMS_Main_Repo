<ion-header>
   <ion-toolbar>
      <ion-title>My Team</ion-title>
   </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

   <!-- ⏳ Loader -->
   <div class="loading-container" *ngIf="loading">
      <ion-spinner></ion-spinner>
      <p>Loading team members...</p>
   </div>

   <!-- 🧑‍🤝‍🧑 Team List -->
   <ion-list class="team-list-view" *ngIf="!loading && teamMembers.length">

      <!-- DEBUG (keep for now) -->
      <!-- {{ teamMembers | json }} -->

      <ion-item *ngFor="let member of teamMembers" lines="full">

         <ion-avatar slot="start">
            <img [src]="getProfileImage(member)" />
         </ion-avatar>

         <ion-label>
            <h2>{{ member.FullName || member.full_name || 'N/A' }}</h2>
            <p>{{ member.WorkEmail || member.work_email || '—' }}</p>
            <p class="sub-text">
               {{ member.department || member.department_name || '—' }}
            </p>
         </ion-label>

         <ion-badge slot="end" [color]="member.status === 'On Leave' ? 'warning' : 'success'">
            {{ member.status || 'Active' }}
         </ion-badge>

      </ion-item>

   </ion-list>

   <!-- ❌ Empty State -->
   <div class="empty" *ngIf="!loading && !teamMembers.length">
      <ion-icon name="people-outline"></ion-icon>
      <p>No team members found</p>
   </div>

</ion-content>
