<ion-content class="ion-padding custom-popup">

  <!-- HEADER -->
  <div class="row-space-between">
    <div>
      <h2>Add New Candidate</h2>
      <p>Fill candidate personal details</p>
    </div>
    <ion-button fill="clear" (click)="close()">
      <ion-icon name="close-outline"></ion-icon>
    </ion-button>
  </div>

  <form [formGroup]="candidateForm" (ngSubmit)="submitForm()">

    <!-- NAME -->
    <ion-grid>
      <ion-row>
        <ion-col size="4">
          <ion-item>
            <ion-label position="floating">First Name *</ion-label>
            <ion-input formControlName="first_name"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="4">
          <ion-item>
            <ion-label position="floating">Middle Name</ion-label>
            <ion-input formControlName="middle_name"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="4">
          <ion-item>
            <ion-label position="floating">Last Name *</ion-label>
            <ion-input formControlName="last_name"></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size="6">
          <ion-item>
            <ion-label position="floating">Full Name</ion-label>
            <ion-input formControlName="full_name" readonly></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="6">
          <ion-item>
            <ion-label position="floating">Email *</ion-label>
            <ion-input type="email" formControlName="email"></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- CONTACT -->
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <ion-item>
            <ion-label position="floating">Phone *</ion-label>
            <ion-input formControlName="phone"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="6">
          <ion-item>
            <ion-label position="floating">Alternate Phone</ion-label>
            <ion-input formControlName="alternate_phone"></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- DOB & GENDER -->
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <ion-item>
            <ion-label position="stacked">Date of Birth *</ion-label>

            <ion-input
              id="dob-input"
              readonly
              placeholder="Select Date of Birth"
              [value]="candidateForm.value.date_of_birth | date:'yyyy-MM-dd'">
            </ion-input>

            <ion-popover trigger="dob-input">
              <ng-template>
                <ion-datetime
                  presentation="date"
                  [max]="maxDOB"
                  formControlName="date_of_birth">
                </ion-datetime>
              </ng-template>
            </ion-popover>
          </ion-item>
        </ion-col>

        <ion-col size="6">
          <ion-item>
            <ion-label>Gender *</ion-label>
            <ion-select formControlName="gender">
              <ion-select-option value="Male">Male</ion-select-option>
              <ion-select-option value="Female">Female</ion-select-option>
              <ion-select-option value="Other">Other</ion-select-option>
            </ion-select>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- RECRUITMENT SOURCE -->
    <ion-item>
      <ion-label>Recruitment Source</ion-label>
      <ion-select formControlName="recruitment_source">
        <ion-select-option value="LinkedIn">LinkedIn</ion-select-option>
        <ion-select-option value="Naukri">Naukri</ion-select-option>
        <ion-select-option value="Indeed">Indeed</ion-select-option>
        <ion-select-option value="Referral">Referral</ion-select-option>
      </ion-select>
    </ion-item>

    <!-- SAVE -->
    <ion-button expand="block" type="submit" [disabled]="submitting">
      {{ submitting ? 'Saving...' : 'Save & Continue' }}
    </ion-button>

  </form>
</ion-content>
