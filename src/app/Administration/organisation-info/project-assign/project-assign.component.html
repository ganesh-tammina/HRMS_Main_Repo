<ion-content class="ion-padding">

  <!-- PROJECT SELECT -->
  <ion-item>
    <ion-label>Project</ion-label>
    <ion-select (ionChange)="onProjectChange($event.detail.value)">
      <ion-select-option *ngFor="let p of projects" [value]="p.id">
        {{ p.project_name }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <!-- CREATE SHIFT -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Create Shift</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="shiftForm">
        <ion-input placeholder="Shift Name" formControlName="shift_name"></ion-input>
        <ion-input placeholder="Shift Type" formControlName="shift_type"></ion-input>
        <ion-input type="time" formControlName="start_time"></ion-input>
        <ion-input type="time" formControlName="end_time"></ion-input>

        <ion-button expand="block" (click)="createShift()">
          Add Shift
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>

  <!-- ASSIGN EMPLOYEE -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Assign Employee</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="assignForm">
        <ion-input placeholder="Employee ID" formControlName="employee_id"></ion-input>
        <ion-input placeholder="Role" formControlName="role_in_project"></ion-input>

        <ion-select placeholder="Shift" formControlName="shift_id">
          <ion-select-option *ngFor="let s of shifts" [value]="s.id">
            {{ s.shift_name }}
          </ion-select-option>
        </ion-select>

        <ion-input type="number" formControlName="allocation_percentage"></ion-input>
        <ion-input type="date" formControlName="assignment_start_date"></ion-input>
        <ion-input type="date" formControlName="assignment_end_date"></ion-input>

        <ion-button expand="block" (click)="assignEmployee()">
          Assign Employee
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>

  <!-- ASSIGNMENT LIST -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Assigned Employees</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item *ngFor="let a of assignments">
        <ion-label>
          <h2>{{ a.employee_name }}</h2>
          <p>{{ a.designation_name }} | {{ a.shift_name }}</p>
        </ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

</ion-content>
