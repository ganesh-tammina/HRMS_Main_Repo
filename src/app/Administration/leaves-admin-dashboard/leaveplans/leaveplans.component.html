<ion-header>
  <ion-toolbar>
    <ion-title>Create Leave Plan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <form [formGroup]="leavePlanForm">

    <ion-item>
      <ion-label position="stacked">Plan Name</ion-label>
      <ion-input formControlName="name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Leave Year Start Month</ion-label>
      <ion-input type="number" formControlName="leave_year_start_month"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Leave Year Start Day</ion-label>
      <ion-input type="number" formControlName="leave_year_start_day"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Description</ion-label>
      <ion-textarea formControlName="description"></ion-textarea>
    </ion-item>

    <ion-button expand="block" color="primary" [disabled]="loading" (click)="submit()">
      {{ loading ? 'Saving...' : 'Create Leave Plan' }}
    </ion-button>

  </form>

  <!-- ================= EXISTING PLANS ================= -->

  <h2 style="margin-top: 30px;">Leave Plans</h2>

  <ion-spinner *ngIf="loadingPlans" name="crescent"></ion-spinner>

  <ion-card *ngFor="let plan of leavePlans">
    <ion-card-header>
      <ion-card-title>{{ plan.name }}</ion-card-title>
      <ion-card-subtitle>
        Start: {{ plan.leave_year_start_month }}/{{ plan.leave_year_start_day }}
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <p>{{ plan.description }}</p>
    </ion-card-content>
  </ion-card>

</ion-content>
