<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Update Leave Allocation</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Leave Plan Details</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="allocationForm">
        <ion-item>
          <ion-label position="stacked">Leave Plan</ion-label>
          <ion-select placeholder="Select Leave Plan" [value]="selectedPlanId"
            (ionChange)="onPlanChange($event.detail.value)">
            <ion-select-option *ngFor="let plan of leavePlans" [value]="plan.id">
              {{ plan.name }}
            </ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Description</ion-label>
          <ion-textarea formControlName="description" rows="3"></ion-textarea>
        </ion-item>

        <h3 class="section-title" style="margin-top: 20px; font-weight: bold;">Allocations</h3>

        <div formArrayName="allocations">
          <div *ngFor="let alloc of allocations.controls; let i = index" [formGroupName]="i" class="allocation-card"
            style="border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
            <ion-grid>
              <ion-row>
                <ion-col size="5">
                  <ion-label>Leave Type</ion-label>
                  <ion-select placeholder="Type" formControlName="leave_type_id" interface="popover">
                    <ion-select-option *ngFor="let type of filteredLeaveTypes" [value]="type.id">
                      {{ type.type_name }}
                    </ion-select-option>
                  </ion-select>
                </ion-col>

                <ion-col size="4">
                  <ion-label>Days</ion-label>
                  <ion-input type="number" formControlName="days_allocated" placeholder="0"></ion-input>
                </ion-col>

                <ion-col size="3">
                  <ion-label>Prorate</ion-label>
                  <ion-toggle formControlName="prorate_on_joining"></ion-toggle>
                </ion-col>
              </ion-row>
            </ion-grid>

            <ion-button size="small" color="danger" fill="clear" (click)="removeAllocation(i)">
              <ion-icon name="trash-outline" slot="start"></ion-icon>
              Remove
            </ion-button>
          </div>
        </div>

        <ion-button expand="block" fill="outline" (click)="addAllocation()" style="margin-top: 10px;">
          + Add New Allocation Row
        </ion-button>

        <ion-button expand="block" class="ion-margin-top" [disabled]="loading" (click)="submitallocationLeaves()">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Save & Allocate Leaves</span>
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
