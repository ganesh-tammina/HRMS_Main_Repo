<ion-app>
  <app-header *ngIf="!isLoginPage && !iscandiateofferPage && !iscandiateofferLetterPage" [employee]="one"></app-header>

  <ion-split-pane contentId="main-content"
    [ngClass]="!isLoginPage && !iscandiateofferPage && !iscandiateofferLetterPage ? 'main-content-block' : ''">
    <ng-container *ngIf="!iscandiateofferPage && !iscandiateofferLetterPage">
      <ion-menu *ngIf="showMenu" contentId="main-content" type="overlay">
        <ion-content class="menu-content sidenav-content">
          <ion-list class="side-menu-list">
            <ion-menu-toggle auto-hide="false">
              <ion-item routerLink="/Home" lines="none" detail="false">
                <div class="row-left">
                    <img src="../assets/icon/home.svg" width="24" height="24" class="inactive-menu"/>
                    <img src="../assets/icon/home-active.svg" width="24" height="24" class="active-menu"/>
                  <ion-label>Home</ion-label>
                </div>
              </ion-item>
            </ion-menu-toggle>

            <ion-menu-toggle auto-hide="false">
              <ion-item [routerLink]="['/leaves']" lines="none" detail="false"
                [ngClass]="(currentUrl=='/leaves') ? 'selected':''">
                <div class="row-left">
                  <img src="../assets/icon/Me.svg" width="24" height="24" class="inactive-menu" title="Leave"/>
                  <img src="../assets/icon/Me-active.svg" width="24" height="24" class="active-menu" title="Leave"/>
                  <ion-label>Leave</ion-label>
                </div>
              </ion-item>
            </ion-menu-toggle>

            <!-- <div class="dropdown-wrapper"> -->
            <!-- Org Parent Item -->
            <ion-menu-toggle auto-hide="false" id="menu-button">
              <ion-item lines="none" detail="false" routerLink="/pre-onboarding-cards"
                [ngClass]="(currentUrl=='/pre-onboarding-cards') ? 'selected ion-activatable':''">
                <div class="row-left">
                    <img src="../assets/icon/oraganization.svg" width="24" height="24" class="inactive-menu" title="My Team"/>
                    <img src="../assets/icon/oraganization-active.svg" width="24" height="24" class="active-menu" title="My Team"/>
                  <ion-label>Org</ion-label>
                </div>
              </ion-item>
            </ion-menu-toggle>
            <ion-popover trigger="menu-button" [dismissOnSelect]="true" triggerAction="hover" class="menu-dropdown" side="right">
              <ng-template>
                <ion-content>
                  <ion-menu-toggle auto-hide="false">
                    <!-- *ngIf="(currentUser | async)?.jobDetailsForm?.Department === 'QA'" -->
                    <ion-item routerLink="/pre-onboarding-cards" (click)="preonboard()" lines="none" detail="false"
                      [ngClass]="(currentUrl=='/pre-onboarding-cards') ? 'selected':''">
                      <ion-label>Pre Onboarding</ion-label>
                    </ion-item>
                  </ion-menu-toggle>                  
                  <ion-menu-toggle auto-hide="false">
                    <ion-item routerLink="/post-onboarding" lines="none" detail="false">
                      <ion-label>Post Onboarding</ion-label>
                    </ion-item>
                  </ion-menu-toggle>
                  <ion-menu-toggle auto-hide="false">
                    <ion-item lines="none" detail="false">
                      <ion-label>Candidate Status</ion-label>
                    </ion-item>
                  </ion-menu-toggle>
                </ion-content>
              </ng-template>
            </ion-popover>
            <!-- Submenu Dropdown -->
            <!-- <div class="dropdown-menu" *ngIf="(currentUser | async)?.jobDetailsForm?.Department === 'HR'">
              <ion-menu-toggle auto-hide="false">
                <ion-item routerLink="/pre_onboarding" (click)="preonboard()" lines="none" detail="false">
                  <ion-label>Pre Onboarding</ion-label>
                </ion-item>
              </ion-menu-toggle>
              <ion-menu-toggle auto-hide="false">
                <ion-item routerLink="/post-onboarding" lines="none" detail="false">
                  <ion-label>Post Onboarding</ion-label>
                </ion-item>
              </ion-menu-toggle>
            </div> -->
            <!-- </div> -->

            <!-- ///////////////////////////////////////////////// -->
            <!-- ///////////////////////////////////////////////// -->
            <!-- ///////////////////////////////////////////////// -->

            <!-- My Team -->

            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="['/MyTeam']" lines="none" detail="false"
                routerLinkActive="selected" [ngClass]="(currentUrl=='/MyTeam') ? 'selected':''">
                <div class="row-left">
                    <img src="../assets/icon/my-team.svg" width="24" height="24" class="inactive-menu" title="My Team"/>
                    <img src="../assets/icon/my-team-active.svg" width="24" height="24" class="active-menu"  title="My Team"/>
                  <ion-label>My Team</ion-label>
                </div>
              </ion-item>
            </ion-menu-toggle>
            <!-- <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="['/organisation_info']" lines="none" detail="false"
                routerLinkActive="selected">
                <div class="row-left">
                  <img src="assets/Icons/Group 104.svg" width="24" height="24">
                  <ion-label>Org Info</ion-label>
                </div>
              </ion-item>
            </ion-menu-toggle> -->

            <!-- My TEam -->

            <!-- ///////////////////////////////////////////////// -->
            <!-- ///////////////////////////////////////////////// -->
            <!-- ///////////////////////////////////////////////// -->

            <!-- Admin -->
            <ion-menu-toggle auto-hide="false">
              <ion-item routerLink="/admin" lines="none" detail="false">
                <div class="row-left">
                    <img src="../assets/icon/my-team.svg" width="24" height="24" class="inactive-menu"/>
                    <img src="../assets/icon/my-team-active.svg" width="24" height="24" class="active-menu"/>
                  <ion-label>Admin</ion-label>
                </div>
              </ion-item>
            </ion-menu-toggle>
            <!-- Admin -->

            <!-- ///////////////////////////////////////////////// -->
            <!-- ///////////////////////////////////////////////// -->
            <!-- ///////////////////////////////////////////////// -->

            <!-- Inbox -->
            <ion-menu-toggle auto-hide="false">
              <ion-item lines="none" detail="false" routerLinkActive="selected">
                <div class="row-left">
                    <img src="../assets/icon/inbox.svg" width="24" height="24" class="inactive-menu"/>
                    <img src="../assets/icon/inbox-active.svg" width="24" height="24" class="active-menu"/>
                  <ion-label>Inbox</ion-label>
                </div>
              </ion-item>
            </ion-menu-toggle>
            <ion-menu-toggle auto-hide="false">
              <ion-item lines="none" detail="false" routerLinkActive="selected" [routerLink]="['/workTrack']">
                <div class="row-left">
                    <img src="../assets/icon/work-track.svg" width="24" height="24" class="inactive-menu"/>
                    <img src="../assets/icon/work-track-active.svg" width="24" height="24" class="active-menu"/>
                  <ion-label>Work Track</ion-label>
                </div>
              </ion-item>
            </ion-menu-toggle>
            <ion-menu-toggle auto-hide="false" id="menu-buttons1">
              <ion-item lines="none" detail="false" routerLink="/pre-onboarding-cards" routerLinkActive="selected"
                [ngClass]="(currentUrl=='/pre-onboarding-cards') ? 'selected ion-activatable':''">
                <div class="row-left">
                    <img src="../assets/icon/myfinance.svg" width="24" height="24" class="inactive-menu" title="This is a simple tooltip"/>
                    <img src="../assets/icon/myfinance-active.svg" width="24" height="24" class="active-menu"/>
                  <ion-label>My Finances</ion-label>
                </div>
              </ion-item>
            </ion-menu-toggle>
            <ion-popover trigger="menu-buttons1" [dismissOnSelect]="true" triggerAction="hover" class="menu-dropdown menu-drop1" side="right">
              <ng-template>
                <ion-content>
                  <ion-menu-toggle auto-hide="false">
                    <!-- *ngIf="(currentUser | async)?.jobDetailsForm?.Department === 'QA'" -->
                    <ion-item routerLink="/payslip" lines="none" detail="false"
                      [ngClass]="(currentUrl=='/payslip') ? 'selected':''">
                      <ion-label>Pay Slips</ion-label>
                    </ion-item>
                  </ion-menu-toggle>
                </ion-content>
              </ng-template>
            </ion-popover>
            <!-- Inbox -->

            <!-- ///////////////////////////////////////////////// -->

            <!-- Log Out -->
            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" (click)="logout()" lines="none" detail="false"
                routerLinkActive="selected">
                <div class="row-left">
                    <img src="../assets/icon/logout.svg" width="24" height="24" class="inactive-menu"/>
                    <img src="../assets/icon/logout-active.svg" width="24" height="24" class="active-menu"/>
                  <ion-label>Log out</ion-label>
                </div>
              </ion-item>
            </ion-menu-toggle>
            <!-- Log Out -->
          </ion-list>
        </ion-content>
      </ion-menu>
    </ng-container>
    <!-- Quick refresh overlay -->
    <div *ngIf="isRefreshing" class="refresh-overlay">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
    </div>

    <ion-router-outlet id="main-content" [ngClass]="{'refreshing': isRefreshing}"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
