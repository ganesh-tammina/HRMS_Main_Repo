<div class="payroll-container">
  <div class="header">
    <div>
      <h2>Payroll Components</h2>
      <p>Configure salary structure percentages</p>
    </div>
    <button class="primary-btn">Save Configuration</button>
  </div>

  <div class="components-card">

    <!-- Add Component Section -->
    <div class="section-title">Add New Component</div>

    <form [formGroup]="componentForm"
          (ngSubmit)="createComponent()"
          class="component-form">

      <input type="text" placeholder="Component Name" formControlName="name" />

      <select formControlName="type">
        <option value="Earning">Earning</option>
        <option value="Deduction">Deduction</option>
        <option value="Reimbursement">Reimbursement</option>
      </select>

      <select formControlName="calculation_type">
        <option value="Flat">Flat</option>
        <option value="Percentage">Percentage</option>
        <option value="Formula">Formula</option>
      </select>

      <input
        type="number"
        formControlName="value"
        placeholder="Value"
        *ngIf="componentForm.value.calculation_type !== 'Formula'"
      />

      <input
        type="text"
        formControlName="formula"
        placeholder="Formula"
        *ngIf="componentForm.value.calculation_type === 'Formula'"
      />

      <label class="check">
        <input type="checkbox" formControlName="is_statutory" />
        Statutory
      </label>

      <label class="check">
        <input type="checkbox" formControlName="is_taxable" />
        Taxable
      </label>

      <button type="submit" class="primary-btn">Add</button>
    </form>

    <!-- Component List -->
    <div class="section-title">Configured Components</div>

    <div class="component-table">
      <div class="table-head">
        <span>Name</span>
        <span>Type</span>
        <span>Value</span>
      </div>

      <div class="table-row" *ngFor="let comp of components">
        <span class="name">{{ comp.name }}</span>
        <span class="badge" [ngClass]="comp.type.toLowerCase()">
          {{ comp.type }}
        </span>
        <span class="value">{{ comp.value }}%</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="total">
        Total: <strong>{{ getTotal() }}%</strong>
      </div>
    </div>

  </div>
</div>
